{% extends 'base.html' %}

{% block title %}Login - Nyondo Stock{% endblock %}

{% block content %}

<div style="min-height: 80vh; display: flex;
            align-items: center; justify-content: center;">

             <!-- Faint background icons — evenly spread, more visible -->
    <i class="bi bi-hammer"
       style="position: absolute; left: 4%; top: 8%;
              font-size: 85px; opacity: 0.08;
              color: #6B0F1A; pointer-events: none;"></i>

    <i class="bi bi-distribute-horizontal"
       style="position: absolute; right: 4%; top: 8%;
              font-size: 85px; opacity: 0.08;
              color: #6B0F1A; pointer-events: none;"></i>

    <i class="bi bi-bag"
       style="position: absolute; left: 8%; top: 45%;
              font-size: 75px; opacity: 0.08;
              color: #C9A84C; pointer-events: none;"></i>

    <i class="bi bi-house-roof"
       style="position: absolute; right: 8%; top: 45%;
              font-size: 75px; opacity: 0.08;
              color: #C9A84C; pointer-events: none;"></i>

    <i class="bi bi-gear"
       style="position: absolute; left: 20%; bottom: 5%;
              font-size: 65px; opacity: 0.07;
              color: #6B0F1A; pointer-events: none;"></i>

    <i class="bi bi-truck"
       style="position: absolute; right: 20%; bottom: 5%;
              font-size: 65px; opacity: 0.07;
              color: #6B0F1A; pointer-events: none;"></i>

    <i class="bi bi-tools"
       style="position: absolute; left: 44%; top: 4%;
              font-size: 55px; opacity: 0.07;
              color: #C9A84C; pointer-events: none;"></i>

    <i class="bi bi-box-seam"
       style="position: absolute; left: 30%; bottom: 8%;
              font-size: 60px; opacity: 0.07;
              color: #C9A84C; pointer-events: none;"></i>

    <i class="bi bi-wrench"
       style="position: absolute; right: 30%; bottom: 8%;
              font-size: 60px; opacity: 0.07;
              color: #6B0F1A; pointer-events: none;"></i>

    <!-- Login card -->
    <div style="background: white; border-radius: 12px;
                box-shadow: 0 12px 35px rgba(0,0,0,0.15);
                width: 100%; max-width: 420px;
                position: relative; overflow: hidden;">

        <!-- Faint background icons -->
        <i class="bi bi-hammer"
           style="position: absolute; right: -15px; top: -10px;
                  font-size: 120px; opacity: 0.04;
                  color: #6B0F1A; pointer-events: none;"></i>
        <i class="bi bi-gear"
           style="position: absolute; left: -20px; bottom: -15px;
                  font-size: 110px; opacity: 0.04;
                  color: #C9A84C; pointer-events: none;"></i>
        <i class="bi bi-tools"
           style="position: absolute; right: 10px; bottom: 60px;
                  font-size: 70px; opacity: 0.03;
                  color: #6B0F1A; pointer-events: none;"></i>

        <!-- Form content -->
        <div style="padding: 28px 35px 40px;
                    position: relative; z-index: 1;">

            <!-- NH Logo -->
            <div style="text-align: center; margin-bottom: 18px;">
                <div style="background-color: #6B0F1A; color: #C9A84C;
                            font-size: 24px; font-weight: bold;
                            width: 55px; height: 55px; border-radius: 10px;
                            display: flex; align-items: center;
                            justify-content: center; margin: 0 auto 12px;">
                    NH
                </div>
                <p style="color: #6B0F1A; font-size: 15px;
                          font-weight: bold; letter-spacing: 3px; margin: 0;">
                    NYONDO HARDWARE
                </p>
                <p style="color: #888; font-size: 11px;
                          letter-spacing: 1px; margin: 4px 0 0 0;">
                    Stock Management System
                </p>
            </div>

            <!-- Tagline -->
            <p style="text-align: center; font-size: 12px;
                      margin: 0 0 18px 0; letter-spacing: 1px;">
                <span style="color: #C9A84C; font-weight: bold;">Track</span>
                <span style="color: #888;"> • </span>
                <span style="color: #C9A84C; font-weight: bold;">Sell</span>
                <span style="color: #888;"> • </span>
                <span style="color: #C9A84C; font-weight: bold;">Manage</span>
                <span style="color: #888;"> • </span>
                <span style="color: #C9A84C; font-weight: bold;">Grow</span>
            </p>

            <hr style="border: none; border-top: 1px solid #f2e8d5;
                       margin: 0 0 18px 0;">

            <!-- Error message -->
            {% if error %}
            <div class="error" style="margin-bottom: 15px;">
                <i class="bi bi-exclamation-circle"
                   style="margin-right: 6px;"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <!-- Username -->
                <div class="form-group">
                    <label style="font-size: 14px; font-weight: 600;">
                        <i class="bi bi-person"
                           style="color: #C9A84C; margin-right: 5px;"></i>
                        Username
                    </label>
                    <input type="text" name="username"
                           placeholder="Enter your username">
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label style="font-size: 14px; font-weight: 600;">
                        <i class="bi bi-lock"
                           style="color: #C9A84C; margin-right: 5px;"></i>
                        Password
                    </label>
                    <input type="password" name="password"
                           placeholder="Enter your password">
                </div>

                <!-- Remember me + help text -->
                <div style="display: flex; align-items: center;
                            justify-content: space-between;
                            margin-bottom: 20px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" name="remember"
                               id="remember"
                               style="width: auto; margin: 0;
                                      accent-color: #6B0F1A;">
                        <label for="remember"
                               style="margin: 0; font-size: 13px;
                                      color: #888; font-weight: normal;
                                      cursor: pointer;">
                            Remember me
                        </label>
                    </div>
                    <span style="font-size: 12px; color: #C9A84C;
                                 cursor: pointer;">
                        Need help? Contact admin
                    </span>
                </div>

                <!-- Login button -->
                <button type="submit"
                        style="width: 100%; padding: 12px;
                               font-size: 14px; letter-spacing: 2px;
                               border-radius: 6px; transition: 0.3s ease;"
                        onmouseover="this.style.backgroundColor='#C9A84C';
                                     this.style.color='#6B0F1A';"
                        onmouseout="this.style.backgroundColor='#6B0F1A';
                                    this.style.color='#F2E8D5';">
                    <i class="bi bi-box-arrow-in-right"
                       style="margin-right: 8px;"></i>
                    ACCESS SYSTEM
                </button>

            </form>

            <!-- Back to home -->
<p style="text-align: center; margin-top: 16px;">
    <a href="{% url 'landing' %}"
       style="color: #6B0F1A; font-size: 14px;
              font-weight: 600; letter-spacing: 1px;">
        <i class="bi bi-arrow-left" style="margin-right: 4px;"></i>
        Back to Home
    </a>
</p>

        </div>
        <!-- end form content -->

    </div>
    <!-- end login card -->

</div>

{% endblock %}
