{% extends 'base.html' %}

{% block title %}Login - Nyondo Stock{% endblock %}

{% block content %}

<div style="max-width: 420px; margin: 60px auto;">

    <!-- Master card -->
    <div style="background: white; border-radius: 10px;
                box-shadow: 0 8px 24px rgba(0,0,0,0.10);
                overflow: hidden;">

        <!-- Card header -->
        <div style="background: #6B0F1A; padding: 30px 25px;
                    text-align: center;">

            <!-- NH Logo -->
            <div style="background-color: #C9A84C; color: #6B0F1A;
                        font-size: 22px; font-weight: bold;
                        width: 55px; height: 55px; border-radius: 8px;
                        display: flex; align-items: center;
                        justify-content: center; margin: 0 auto 12px;">
                NH
            </div>

            <p style="color: #F2E8D5; font-size: 16px;
                      font-weight: bold; letter-spacing: 2px; margin: 0;">
                NYONDO HARDWARE
            </p>
            <p style="color: #C9A84C; font-size: 11px;
                      letter-spacing: 1px; margin: 5px 0 0 0;">
                STOCK MANAGEMENT SYSTEM
            </p>
        </div>

        <!-- Form content -->
        <div style="padding: 30px 25px;">

            <!-- Sign in title -->
            <p style="text-align: center; color: #6B0F1A;
                      font-weight: bold; font-size: 13px;
                      letter-spacing: 2px; margin: 0 0 20px 0;">
                      <i class="bi bi-lock-fill me-2"></i> 
                SIGN IN
            </p>

            <!-- Error message -->
            {% if error %}
            <div class="error">
                {{ error }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <!-- Username -->
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username"
                           placeholder="Enter your username">
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password"
                           placeholder="Enter your password">
                </div>

                <!-- Login button -->
                <button type="submit"
                        style="width: 100%; padding: 12px;
                               font-size: 15px; letter-spacing: 1px;
                               margin-top: 10px; border-radius: 6px;
                               transition: 0.3s ease;">
                    LOGIN
                </button>

            </form>

            <!-- Back to home -->
            <p style="text-align: center; margin-top: 20px; font-size: 13px;">
                <a href="{% url 'landing' %}" style="color: #6B0F1A;">
                    Back to Home
                </a>
            </p>

        </div>
        <!-- end form content -->

    </div>
    <!-- end master card -->

</div>

{% endblock %}
