{% extends 'base.html' %}

{% block title %}Login - Nyondo Stock{% endblock %}

{% block content %}

    <div style="max-width: 400px; margin: 60px auto; 
                background: white; padding: 40px; 
                border-radius: 8px; border-top: 4px solid #6B0F1A;">

        <h1 style="text-align: center; margin-bottom: 30px;">Login</h1>

        <!-- Show error message if login failed -->
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" placeholder="Enter your username">

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password">

            <button type="submit" style="width: 100%; padding: 12px; 
                                         font-size: 15px; margin-top: 10px;">
                Login
            </button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            <a href="{% url 'landing' %}">Back to Home</a>
        </p>

    </div>

{% endblock %}
