<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nyondo Stock{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #F2E8D5;
            color: #6B0F1A;
        }

        /*  Navbar */
        .navbar {
            background-color: #6B0F1A;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /*  Logo  */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background-color: #C9A84C;
            color: #6B0F1A;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-name {
            color: #F2E8D5;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo-tagline {
            color: #C9A84C;
            font-size: 10px;
            letter-spacing: 1px;
        }

        /*  Nav links  */
        .nav-links a {
            color: #F2E8D5;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 4px;
        }

        .nav-links a:hover {
            background-color: #C9A84C;
            color: #6B0F1A;
        }

        .nav-links a.active {
            background-color: #C9A84C;
            color: #6B0F1A;
        }

        /*  Main container  */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /*  Page heading  */
        h1 {
            color: #6B0F1A;
            margin-bottom: 20px;
            border-left: 5px solid #C9A84C;
            padding-left: 10px;
        }

        h2, h3 {
            color: #6B0F1A;
            margin: 20px 0 10px 0;
        }

        /*  Tables  */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            margin-top: 10px;
            border-radius: 6px;
            overflow: hidden;
        }

        table th {
            background-color: #6B0F1A;
            color: #F2E8D5;
            padding: 12px 15px;
            text-align: left;
            font-size: 13px;
        }

        table td {
            padding: 10px 15px;
            border-bottom: 1px solid #F2E8D5;
            font-size: 14px;
            color: #3a3a3a;
        }

        table tr:hover {
            background-color: #fdf6ec;
        }

        /*  Links  */
        a {
            color: #6B0F1A;
            text-decoration: none;
        }

        a:hover {
            color: #C9A84C;
        }

        /*  Buttons  */
        button, .btn {
            background-color: #6B0F1A;
            color: #F2E8D5;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
        }

        button:hover, .btn:hover {
            background-color: #C9A84C;
            color: #6B0F1A;
        }

        /*  Action links  */
        .action-edit {
            color: #6B0F1A;
            font-weight: bold;
            margin-right: 8px;
        }

        .action-delete {
            color: #c0392b;
            font-weight: bold;
        }

        /*  Forms  */
        label {
            font-size: 14px;
            font-weight: bold;
            color: #6B0F1A;
            display: block;
            margin-bottom: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px 12px;
            margin-bottom: 15px;
            border: 1px solid #C9A84C;
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
            color: #3a3a3a;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #6B0F1A;
        }

        /*  Error messages  */
        .error {
            color: #c0392b;
            background-color: #ffe6e6;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            border-left: 4px solid #c0392b;
        }

        /*  Top action bar  */
        .action-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-bar a {
            background-color: #6B0F1A;
            color: #F2E8D5;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
        }

        .action-bar a:hover {
            background-color: #C9A84C;
            color: #6B0F1A;
        }

        /*  Summary cards  */
        .cards {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .card {
            background-color: #fff;
            border-left: 5px solid #C9A84C;
            padding: 16px 20px;
            border-radius: 6px;
            flex: 1;
            min-width: 180px;
        }

        .card p {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }

        .card h2 {
            font-size: 24px;
            color: #6B0F1A;
            margin: 0;
        }

        /*  HR  */
        hr {
            border: none;
            border-top: 1px solid #C9A84C;
            margin: 20px 0;
            opacity: 0.4;
        }

        /*  Footer  */
        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 100px;
            background-color: #6B0F1A;
            color: #F2E8D5;
            font-size: 13px;
        }

        .footer span {
            color: #C9A84C;
        }
    </style>
</head>
<body>

    <!-- Navbar — only shows when user is logged in -->
    {% if request.user.is_authenticated %}
    <nav class="navbar">

        <!-- Logo -->
        <a href="{% url 'stock_dashboard' %}" class="logo">
            <div class="logo-icon">NH</div>
            <div class="logo-text">
                <span class="logo-name">NYONDO HARDWARE</span>
                <span class="logo-tagline">STOCK MANAGEMENT SYSTEM</span>
            </div>
        </a>

        <!-- Nav links -->
        <div class="nav-links">
            <a href="{% url 'stock_dashboard' %}">Stock</a>
            <a href="{% url 'sale_list' %}">Sales</a>
            <a href="{% url 'scheme_customer_list' %}">Scheme</a>
            <a href="{% url 'reports_dashboard' %}">Reports</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>

    </nav>
    {% endif %}

    <!-- Main content -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>Nyondo General Hardware LTD &copy; 2026 —
        <span>Nansana, Uganda</span></p>
    </footer>

</body>
</html>
