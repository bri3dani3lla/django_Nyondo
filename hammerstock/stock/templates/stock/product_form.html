{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

    <h1>{{ title }}</h1>

    <div class="action-bar">
        <a href="{% url 'product_list' %}">Back to Products</a>
    </div>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Product</button>
    </form>

{% endblock %}
