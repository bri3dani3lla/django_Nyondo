{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

    <h1>{{ title }}</h1>

    <div class="action-bar">
        <a href="{% url 'sale_list' %}">Back to Sales</a>
    </div>

    <form method="post">
        {% csrf_token %}

        <h3>Sale Details</h3>
        {{ form.as_p }}

        <h3>Product Being Sold</h3>
        {{ itemform.as_p }}

        <br>
        <button type="submit">Save Sale</button>
    </form>

{% endblock %}
